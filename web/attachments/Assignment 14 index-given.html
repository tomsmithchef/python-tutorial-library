<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Web Page</title>
</head>
<body>
    <h1>My Dynamic Web Page</h1>
    <p id="intro">This is a simple web page to demonstrate DOM manipulation.</p>

    <div id="content">
        <p>This content will be updated using JavaScript.</p>
    </div>

    <button id="addParagraph">Add New Paragraph</button>
    <button id="changeHeader">Change Header</button>
    <button id="removeContent">Remove Content</button>

    <div id="listSection">
        <h2>Dynamic List</h2>
        <ul id="itemList">
            <!-- List items will be added here -->
        </ul>
        <input type="text" id="newItem" placeholder="Add a new item">
        <button id="addItem">Add Item</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
