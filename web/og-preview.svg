<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#183b56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Left glow blob -->
  <ellipse cx="120" cy="315" rx="280" ry="280" fill="#2563eb" opacity="0.07"/>
  <!-- Right glow blob -->
  <ellipse cx="1080" cy="315" rx="260" ry="260" fill="#0f766e" opacity="0.07"/>

  <!-- Py badge -->
  <rect x="80" y="190" width="96" height="96" rx="18" fill="#2563eb"/>
  <text x="128" y="256" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">Py</text>

  <!-- Main title -->
  <text x="204" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="54" font-weight="700" fill="white" letter-spacing="-1">Python Tutorial Library</text>

  <!-- Divider line -->
  <rect x="80" y="314" width="600" height="3" rx="2" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="80" y="368" font-family="'Segoe UI', Arial, sans-serif" font-size="28" fill="#94a3b8" letter-spacing="0.5">Python Fundamentals &amp; Cybersecurity · Lessons 1–9</text>

  <!-- Tagline -->
  <text x="80" y="430" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#64748b">Study notes · Practice exams · Interactive drills</text>

  <!-- Feature pills -->
  <rect x="80" y="468" width="148" height="40" rx="20" fill="rgba(37,99,235,0.18)" stroke="#2563eb" stroke-width="1.5"/>
  <text x="154" y="494" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#93c5fd" text-anchor="middle">MCQ Drills</text>

  <rect x="244" y="468" width="158" height="40" rx="20" fill="rgba(15,118,110,0.18)" stroke="#0f766e" stroke-width="1.5"/>
  <text x="323" y="494" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#5eead4" text-anchor="middle">9 Lessons</text>

  <rect x="418" y="468" width="196" height="40" rx="20" fill="rgba(180,83,9,0.18)" stroke="#b45309" stroke-width="1.5"/>
  <text x="516" y="494" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="#fcd34d" text-anchor="middle">60 Q Practice Exams</text>

  <!-- Right side illustration: code lines -->
  <g opacity="0.18">
    <rect x="820" y="160" width="300" height="310" rx="14" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="820" y="160" width="300" height="38" rx="14" fill="#2563eb" opacity="0.4"/>
    <circle cx="848" cy="179" r="7" fill="#ef4444"/>
    <circle cx="872" cy="179" r="7" fill="#f59e0b"/>
    <circle cx="896" cy="179" r="7" fill="#22c55e"/>
    <text x="844" y="220" font-family="Consolas, monospace" font-size="15" fill="#7dd3fc">def greet(name="World"):</text>
    <text x="860" y="248" font-family="Consolas, monospace" font-size="15" fill="#86efac">    print("Hello,", name)</text>
    <text x="844" y="284" font-family="Consolas, monospace" font-size="15" fill="#7dd3fc">for i in range(5):</text>
    <text x="860" y="312" font-family="Consolas, monospace" font-size="15" fill="#fca5a5">    if i % 2 == 0:</text>
    <text x="876" y="340" font-family="Consolas, monospace" font-size="15" fill="#86efac">        greet()</text>
    <text x="844" y="376" font-family="Consolas, monospace" font-size="15" fill="#c4b5fd">import hashlib</text>
    <text x="844" y="404" font-family="Consolas, monospace" font-size="15" fill="#fca5a5">from scapy.all import *</text>
    <text x="844" y="432" font-family="Consolas, monospace" font-size="15" fill="#7dd3fc">import pandas as pd</text>
  </g>

  <!-- Bottom domain hint -->
  <text x="1120" y="610" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#334155" text-anchor="end">Python Tutorial Library</text>
</svg>
